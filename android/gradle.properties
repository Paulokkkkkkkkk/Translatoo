org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Plugins de terceiros (tflite_flutter 1.8, flutter_tts 11 via toolchain) fixam
# alvos de Java diferentes do jvmTarget que o Kotlin 2.4 assume sob o JDK 21.
# Nao ha como alinha-los sem forkar os plugins; o D8 dexa niveis mistos sem
# problema, entao a validacao vira aviso em vez de erro de build.
kotlin.jvm.target.validation.mode=warning

# org.tensorflow:tensorflow-lite / -api / -gpu 2.11.0 (fixados pelo
# tflite_flutter) publicam os tres AARs com o mesmo package
# `org.tensorflow.lite`. O AGP 9 promoveu essa colisao a erro de merge de
# manifesto e a correcao esta do lado do TensorFlow, nao do app.
android.uniquePackageNames=false
