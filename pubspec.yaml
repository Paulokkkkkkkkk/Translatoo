name: translatoo
description: "Translatoo - Tradutor offline PT <-> EN <-> ZH (Mandarim), 100% on-device."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

# -------------------------------------------------------------------------
# Lista FECHADA de dependencias (plano Secao 4 - nao substituir sem revisao).
# Internet e usada APENAS para download de pacotes de idiomas (RN-02).
# Reaberta e refechada na F2.0 para a entrada do motor de STT (whisper_ggml).
# -------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado / arquitetura
  provider: ^6.1.2

  # Persistencia (M4 - unico acesso via StorageService)
  shared_preferences: ^2.3.0

  # Conectividade (M4 - ConnectionBadge; nada e bloqueado offline)
  connectivity_plus: ^6.0.0

  # Caminhos de arquivos (modelos whisper/TFLite)
  path_provider: ^2.1.4

  # Permissoes (M2 - microfone; uso so a partir da Fase 2)
  permission_handler: ^11.3.1

  # P1 - compartilhar traducao
  share_plus: ^10.0.0

  # M1 - motor de traducao offline (Plano A)
  google_mlkit_translation: ^0.13.0

  # M2 - ditado offline STT (whisper.cpp). Motor decidido na spike F2.0:
  # um unico modelo ggml multilingue cobre pt/en/zh em 56,9 MB, contra 113 MB
  # do Vosk e ~176 MB do sherpa-onnx. Ver docs/stt_spike.md.
  whisper_ggml: ^2.6.0

  # M1 - Plano B TFLite (devices sem Google Play Services)
  tflite_flutter: ^0.11.0

  # M3 - saida por voz TTS nativa
  flutter_tts: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Controle de timers reais nos testes do StorageService (debounce 500 ms)
  fake_async: ^1.3.1

  # Interface da plataforma p/ mockar conectividade nos testes
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  # Diretorios reservados aos modelos embutidos (preenchidos nas Fases 1-2).
  assets:
    - assets/models/whisper/
    - assets/models/tflite/

  # F1.9 - cobertura de Han para o mandarim (RF-CJK-01..04, risco R8).
  # Subset GB2312 de Noto Sans SC (SIL OFL 1.1) - 2,10 MB por peso, 4,20 MB no
  # total, dentro do orcamento de 5 MB do flavor `lite`. Aplicado APENAS como
  # `fontFamilyFallback` em app_theme.dart: PT e EN seguem na fonte nativa.
  # Regeneracao: bash scripts/build_cjk_subset.sh (ver docs/cjk_font.md).
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.subset.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.subset.ttf
          weight: 700
